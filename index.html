<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memo · 심플 메모장</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description" content="언제 어디서든 꺼내 쓰는 심플 개인 메모장" />
  <meta name="theme-color" content="#0a0d12" />
</head>
<body>
  <div class="app">
    <!-- 잠금 화면 -->
    <section class="lock" id="lock">
      <div class="lock-inner">
        <div class="lock-icon">
          <span class="lock-mark">M</span>
        </div>
        <h1 class="lock-title">Memo</h1>
        <p class="lock-sub">메모를 열려면 비밀번호를 입력하세요.</p>
        <form class="lock-form" id="lock-form" autocomplete="off">
          <input
            class="lock-input"
            id="lock-input"
            type="password"
            placeholder="비밀번호"
            autocomplete="new-password"
            required
          />
          <div class="lock-actions">
            <button class="btn btn-primary" type="submit" id="lock-btn">열기</button>
          </div>
          <p class="lock-error" id="lock-error" hidden>비밀번호가 맞지 않아요.</p>
        </form>
        <p class="lock-hint">첫 사용이면 아무 비밀번호나 입력하면 바로 시작됩니다.</p>
      </div>
    </section>

    <!-- 메모 화면 -->
    <section class="memo-screen" id="memo-screen" hidden>
      <header class="memo-header">
        <div class="brand">
          <span class="brand-mark">M</span>
          <span class="brand-name">Memo</span>
        </div>
        <div class="header-actions">
          <button class="btn btn-ghost" id="btn-lock" type="button">잠금</button>
        </div>
      </header>

      <div class="screen-body">
        <div class="memo-toolbar">
          <h2 class="screen-title">내 메모</h2>
          <button class="btn btn-primary btn-sm" id="btn-new" type="button">+ 새 메모</button>
        </div>

        <div class="memo-empty" id="memo-empty" hidden>
          <div class="empty-icon">
            <span class="empty-mark">📝</span>
          </div>
          <div class="empty-title">아직 메모가 없어요</div>
          <div class="empty-sub">아래 버튼으로 새 메모를 만들어보세요.</div>
        </div>

        <ul class="memo-list" id="memo-list"></ul>
      </div>
    </section>

    <!-- 메모 작성/수정 모달 -->
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head">
          <h3 class="modal-title" id="modal-title">메모</h3>
          <button class="btn-icon" id="btn-modal-close" type="button" aria-label="닫기">
            <span class="icon-close"></span>
          </button>
        </div>
        <form class="modal-body" id="memo-form" autocomplete="off">
          <input
            class="field-title"
            id="field-title"
            type="text"
            placeholder="제목"
            maxlength="120"
            required
          />
          <textarea
            class="field-body"
            id="field-body"
            placeholder="메모 내용을 입력하세요."
            rows="8"
          ></textarea>
          <div class="modal-foot">
            <span class="field-count" id="field-count">0</span>
            <div class="modal-actions">
              <button class="btn btn-ghost" type="button" id="btn-delete">삭제</button>
              <button class="btn btn-primary" type="submit" id="btn-save">저장</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
